<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mon IA</title>
<style>
  :root { --bg:#0f1115; --panel:#181b22; --line:#2a2f3a; --text:#e8eaf0; --muted:#8b93a7; --accent:#7c5cff; --me:#2b2350; --err:#ff6b6b; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.5 system-ui, sans-serif; height:100dvh; display:flex; flex-direction:column; }
  header { display:flex; align-items:center; gap:8px; padding:10px 16px; border-bottom:1px solid var(--line); }
  header h1 { font-size:17px; margin:0; flex:1; }
  button { background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:10px; padding:8px 12px; font:inherit; cursor:pointer; }
  button.primary { background:var(--accent); border-color:var(--accent); }
  button.on { background:var(--accent); border-color:var(--accent); }
  #log { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:10px; }
  .msg { max-width:min(720px, 88%); padding:10px 14px; border-radius:14px; background:var(--panel); white-space:pre-wrap; word-wrap:break-word; }
  .msg.user { align-self:flex-end; background:var(--me); }
  .msg.error { color:var(--err); }
  .msg img { display:block; max-width:100%; border-radius:10px; margin-top:6px; }
  .msg a { color:var(--muted); font-size:13px; }
  form#composer { display:flex; gap:8px; padding:12px 16px; border-top:1px solid var(--line); }
  textarea { flex:1; resize:none; background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:10px; padding:10px; font:inherit; min-height:44px; max-height:160px; }
  #settings { position:fixed; inset:0; background:var(--bg); overflow-y:auto; padding:16px; display:none; }
  #settings.open { display:block; }
  #settings .wrap { max-width:640px; margin:0 auto; }
  fieldset { border:1px solid var(--line); border-radius:12px; margin:0 0 16px; padding:12px 14px; }
  legend { color:var(--muted); padding:0 6px; }
  label { display:block; margin:10px 0 4px; color:var(--muted); font-size:13px; }
  input, select, #settings textarea { width:100%; background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:8px; padding:8px 10px; font:inherit; }
  .row { display:flex; gap:10px; } .row > div { flex:1; }
  .check { display:flex; gap:8px; align-items:center; color:var(--text); }
  .check input { width:auto; }
  .hint { color:var(--muted); font-size:12px; margin:4px 0 0; }
</style>
</head>
<body>
<header>
  <h1 id="title">Mon IA</h1>
  <button id="clear" title="Nouvelle conversation">Effacer</button>
  <button id="openSettings">Paramètres</button>
</header>

<div id="log"></div>

<form id="composer">
  <button type="button" id="imgMode" title="Mode image">🖼️</button>
  <textarea id="input" rows="1" placeholder="Écris ton message… (ou /image une description)"></textarea>
  <button class="primary" id="sendBtn">Envoyer</button>
</form>

<div id="settings">
  <div class="wrap">
    <div class="row" style="align-items:center;margin-bottom:12px">
      <h2 style="margin:0;flex:1">Paramètres</h2>
      <button id="closeSettings">Fermer</button>
    </div>
    <form id="settingsForm">
      <fieldset><legend>Personnalité & règles</legend>
        <label>Nom de l’IA</label><input name="assistantName">
        <label>Instructions (prompt système) — c’est ici que tu décides de son comportement</label>
        <textarea name="systemPrompt" rows="6"></textarea>
        <label>Mots bloqués (un par ligne) — refusés dans tes messages et tes prompts d’image</label>
        <textarea name="blockedWords" rows="3"></textarea>
        <label class="check"><input type="checkbox" name="imagesEnabled"> Génération d’images activée</label>
      </fieldset>

      <fieldset><legend>Modèle de texte</legend>
        <label>Fournisseur</label>
        <select name="textProvider">
          <option value="openai">Compatible OpenAI (OpenAI, OpenRouter, Ollama, LM Studio…)</option>
          <option value="anthropic">Anthropic (Claude)</option>
        </select>
        <label>URL de l’API</label><input name="textBaseUrl">
        <p class="hint">OpenAI : https://api.openai.com/v1 · Ollama (local) : http://localhost:11434/v1 · Anthropic : https://api.anthropic.com</p>
        <label>Clé API (vide pour un modèle local)</label><input name="textApiKey" type="password" autocomplete="off">
        <label>Modèle</label><input name="textModel">
        <div class="row">
          <div><label>Température</label><input name="temperature" type="number" step="0.1" min="0" max="2"></div>
          <div><label>Longueur max réponse</label><input name="maxTokens" type="number" min="1"></div>
          <div><label>Mémoire (messages)</label><input name="historyLength" type="number" min="1"></div>
        </div>
      </fieldset>

      <fieldset><legend>Images</legend>
        <label>Fournisseur</label>
        <select name="imageProvider">
          <option value="openai">Compatible OpenAI (gpt-image-1, dall-e-3…)</option>
          <option value="automatic1111">Stable Diffusion local (AUTOMATIC1111 / Forge)</option>
        </select>
        <label>URL de l’API</label><input name="imageBaseUrl">
        <p class="hint">OpenAI : https://api.openai.com/v1 · Stable Diffusion local : http://127.0.0.1:7860</p>
        <label>Clé API</label><input name="imageApiKey" type="password" autocomplete="off">
        <div class="row">
          <div><label>Modèle</label><input name="imageModel"></div>
          <div><label>Taille</label><input name="imageSize" placeholder="1024x1024"></div>
          <div><label>Étapes (SD)</label><input name="imageSteps" type="number" min="1"></div>
        </div>
        <label>Prompt négatif (SD)</label><input name="negativePrompt">
      </fieldset>

      <fieldset><legend>Accès</legend>
        <label>Mot de passe de l’app (vide = aucun)</label><input name="password" type="password" autocomplete="new-password">
      </fieldset>

      <button class="primary" style="width:100%">Enregistrer</button>
      <p class="hint" id="saved"></p>
    </form>
  </div>
</div>

<script>
const $ = (s) => document.querySelector(s);
const log = $('#log'), input = $('#input'), form = $('#settingsForm');
let imageMode = false;
let messages = [];
try { messages = JSON.parse(localStorage.getItem('mon-ia-messages')) || []; } catch {}

function store() { try { localStorage.setItem('mon-ia-messages', JSON.stringify(messages)); } catch {} }
function getPassword() { try { return sessionStorage.getItem('mon-ia-pw') || ''; } catch { return ''; } }

async function api(url, body) {
  const res = await fetch(url, {
    method: body ? 'POST' : 'GET',
    headers: { 'content-type': 'application/json', 'x-password': getPassword() },
    body: body ? JSON.stringify(body) : undefined,
  });
  const data = await res.json();
  if (res.status === 401) {
    const pw = prompt('Mot de passe :');
    if (pw !== null) { try { sessionStorage.setItem('mon-ia-pw', pw); } catch {} return api(url, body); }
  }
  if (!res.ok) throw new Error(data.error || 'Erreur');
  return data;
}

function render(m) {
  const div = document.createElement('div');
  div.className = 'msg ' + (m.role === 'user' ? 'user' : '') + (m.error ? ' error' : '');
  div.textContent = m.content;
  if (m.image) {
    const img = document.createElement('img');
    img.src = m.image;
    const a = document.createElement('a');
    a.href = m.image; a.download = 'image.png'; a.textContent = 'Télécharger';
    div.append(img, a);
  }
  log.append(div);
  log.scrollTop = log.scrollHeight;
  return div;
}

function renderAll() { log.innerHTML = ''; messages.forEach(render); }

async function send() {
  let text = input.value.trim();
  if (!text) return;
  input.value = '';
  let wantImage = imageMode;
  if (text.startsWith('/image ')) { wantImage = true; text = text.slice(7).trim(); }

  const userMsg = { role: 'user', content: wantImage ? '🖼️ ' + text : text };
  messages.push(userMsg); render(userMsg); store();
  const pending = render({ role: 'assistant', content: wantImage ? 'Génération de l’image…' : '…' });

  try {
    let reply;
    if (wantImage) {
      const { image } = await api('/api/image', { prompt: text });
      reply = { role: 'assistant', content: text, image, kind: 'image' };
    } else {
      // Les images ne sont pas renvoyées au modèle de texte.
      const history = messages.filter((m) => !m.error && !m.kind && !m.content.startsWith('🖼️ '));
      const { reply: content } = await api('/api/chat', { messages: history });
      reply = { role: 'assistant', content };
    }
    messages.push(reply);
  } catch (err) {
    messages.push({ role: 'assistant', content: err.message, error: true });
  }
  pending.remove(); render(messages[messages.length - 1]); store();
}

$('#composer').addEventListener('submit', (e) => { e.preventDefault(); send(); });
input.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } });
$('#imgMode').addEventListener('click', () => {
  imageMode = !imageMode;
  $('#imgMode').classList.toggle('on', imageMode);
  input.placeholder = imageMode ? 'Décris l’image à générer…' : 'Écris ton message… (ou /image une description)';
});
$('#clear').addEventListener('click', () => { if (confirm('Effacer la conversation ?')) { messages = []; store(); renderAll(); } });

function fillForm(s) {
  for (const el of form.elements) {
    if (!el.name) continue;
    if (el.type === 'checkbox') el.checked = !!s[el.name];
    else if (el.name === 'blockedWords') el.value = (s.blockedWords || []).join('\n');
    else el.value = s[el.name] ?? '';
  }
  $('#title').textContent = s.assistantName || 'Mon IA';
  document.title = s.assistantName || 'Mon IA';
}

async function loadSettings() {
  try { fillForm(await api('/api/settings')); } catch (err) { $('#saved').textContent = err.message; }
}

$('#openSettings').addEventListener('click', () => { loadSettings(); $('#settings').classList.add('open'); });
$('#closeSettings').addEventListener('click', () => $('#settings').classList.remove('open'));
form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const data = {};
  for (const el of form.elements) {
    if (!el.name) continue;
    if (el.type === 'checkbox') data[el.name] = el.checked;
    else if (el.name === 'blockedWords') data.blockedWords = el.value.split('\n').map((w) => w.trim()).filter(Boolean);
    else data[el.name] = el.value;
  }
  try {
    const saved = await api('/api/settings', data);
    // Si tu changes le mot de passe, on le garde pour la session en cours.
    if (!data.password.startsWith('••••')) { try { sessionStorage.setItem('mon-ia-pw', data.password); } catch {} }
    fillForm(saved);
    $('#saved').textContent = 'Enregistré ✔';
  } catch (err) { $('#saved').textContent = err.message; }
});

renderAll();
loadSettings();
</script>
</body>
</html>
