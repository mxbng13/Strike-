<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vernissage Noir</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#0f1416">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,500;0,6..96,700;1,6..96,500&family=IBM+Plex+Mono:wght@500;600&family=Instrument+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <canvas id="map" aria-label="Carte du monde des musées"></canvas>

  <header id="hud">
    <button class="brand" data-open="rivals" aria-label="Classement">
      <span class="brand-mark">V</span><span class="brand-name">Vernissage <i>Noir</i></span>
    </button>
    <div class="stats">
      <div class="stat"><span class="lbl">Argent</span><b id="h-money" class="num">—</b><small id="h-income" class="num"></small></div>
      <button class="stat rank" data-open="rivals"><span class="lbl">Rang</span><b id="h-rank" class="num">—</b></button>
    </div>
      </header>

  <div id="maptools">
    <button class="icon-btn" data-zoom="in" aria-label="Zoomer">+</button>
    <button class="icon-btn" data-zoom="out" aria-label="Dézoomer">−</button>
    <button class="icon-btn" data-zoom="home" aria-label="Mon musée">◎</button>
  </div>
  <button id="quest" hidden></button>

  <section id="sheet" hidden aria-live="polite"></section>

  <nav id="nav">
    <button data-open="museum"><svg viewBox="0 0 24 24"><path d="M3 9 12 4l9 5v1H3zM5 11h2v7H5zm4 0h2v7H9zm4 0h2v7h-2zm4 0h2v7h-2zM3 19h18v2H3z"/></svg><span>Musée</span></button>
    <button data-open="catalog"><svg viewBox="0 0 24 24"><path d="M4 4h7v7H4zm9 0h7v7h-7zM4 13h7v7H4zm9 0h7v7h-7z"/></svg><span>Collection</span></button>
    <button data-open="shop"><svg viewBox="0 0 24 24"><path d="M3 8 12 3l9 5v11l-9 5-9-5zm9 2.3L5.5 7 12 5.2 18.5 7zM11 12 5 9v9l6 3.3zm2 0v9.3l6-3.3V9z"/></svg><span>Caisses</span></button>
    <button data-open="rivals"><svg viewBox="0 0 24 24"><path d="m6 3 4.5 4.5L9 9 4.5 4.5V3zm12 0h1.5v1.5L9.6 14.4l1.5 1.5-1.4 1.4-1.5-1.5L5.4 18.6 6.8 20 5.4 21.4 2.6 18.6 4 17.2l2.8-2.8-1.5-1.5 1.4-1.4 1.5 1.5zM14.4 12.7l1.4-1.4 1.5 1.5L19.5 10.6l1.4 1.4-2.8 2.8 1.5 1.5-1.4 1.4-1.5-1.5-1.4 1.4 1.4 1.4-1.4 1.4-2.8-2.8z"/></svg><span>Défis</span></button>
  </nav>

  <div id="toasts"></div>
  <div id="modal" hidden></div>
  <div id="duel" hidden></div>
  <div id="loading"><div class="ld-mark">V</div><p>Accrochage des œuvres…</p><div class="ld-bar"><i></i></div></div>
</div>
<script type="module" src="js/main.js"></script>
</body>
</html>
